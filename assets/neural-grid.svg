<svg width="1200" height="230" viewBox="0 0 1200 230"
xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#F7FEFF"/>
<stop offset="100%" stop-color="#DDF5F7"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="3" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>

</defs>

<!-- Background -->
<rect width="1200" height="230" rx="12" fill="url(#bg)"/>

<!-- Neural Network Lines -->

<g stroke="#64BFC8" stroke-width="2" opacity="0.7">

<line x1="30" y1="55" x2="140" y2="115"/>
<line x1="30" y1="175" x2="140" y2="115"/>

<line x1="140" y1="115" x2="230" y2="55"/>
<line x1="140" y1="115" x2="230" y2="175"/>

<line x1="230" y1="55" x2="310" y2="115"/>
<line x1="230" y1="175" x2="310" y2="115"/>

<line x1="890" y1="115" x2="970" y2="55"/>
<line x1="890" y1="115" x2="970" y2="175"/>

<line x1="970" y1="55" x2="1060" y2="115"/>
<line x1="970" y1="175" x2="1060" y2="115"/>

<line x1="1060" y1="115" x2="1170" y2="55"/>
<line x1="1060" y1="115" x2="1170" y2="175"/>

</g>

<!-- Nodes -->

<g fill="#1597A3" filter="url(#glow)">

<circle cx="30" cy="55" r="5"/>
<circle cx="30" cy="175" r="5"/>

<circle cx="140" cy="115" r="8">
<animate attributeName="r"
values="6;10;6"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="230" cy="55" r="5"/>
<circle cx="230" cy="175" r="5"/>

<circle cx="310" cy="115" r="8"/>

<circle cx="890" cy="115" r="8"/>

<circle cx="970" cy="55" r="5"/>
<circle cx="970" cy="175" r="5"/>

<circle cx="1060" cy="115" r="8">
<animate attributeName="r"
values="6;10;6"
dur="2s"
repeatCount="indefinite"/>
</circle>

<circle cx="1170" cy="55" r="5"/>
<circle cx="1170" cy="175" r="5"/>

</g>

<!-- Moving particles -->

<circle r="5" fill="#0B8F9A">

<animateMotion
dur="4s"
repeatCount="indefinite"
path="M30,55 L140,115 L230,55 L310,115"/>

</circle>

<circle r="5" fill="#0B8F9A">

<animateMotion
dur="4s"
repeatCount="indefinite"
path="M1170,55 L1060,115 L970,175 L890,115"/>

</circle>

<!-- Center -->

<text x="600"
y="88"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="42"
font-weight="700"
fill="#17383D">
STUTI JAIN
</text>

<text x="600"
y="125"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="21"
font-weight="600"
fill="#1597A3">
AI/ML Developer
</text>

<text x="600"
y="158"
text-anchor="middle"
font-family="Arial, Helvetica, sans-serif"
font-size="17"
fill="#486267">
Generative AI • RAG • Python
</text>

<!-- Small decorative nodes -->

<g fill="#1597A3">

<circle cx="535" cy="190" r="3"/>
<circle cx="550" cy="190" r="3"/>
<circle cx="650" cy="190" r="3"/>
<circle cx="665" cy="190" r="3"/>

</g>

</svg>
